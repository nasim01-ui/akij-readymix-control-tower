# Render Blueprint - fully automated deployment for Akij Readymix Control Tower.
#
# How it works:
#   Render -> New + -> Blueprint -> select nasim01-ui/akij-readymix-control-tower
#              (branch: main)
#   Render automatically creates BOTH services below from this file.
#   Commit & push to main -> auto re-deploys both services
#   (autoDeploy defaults to "yes" / commit trigger for Blueprint services).
#
# SECURITY:
#   All secrets use "sync: false" -> Render never reads them from git.
#   You enter their VALUES once in the Render dashboard
#   (service -> Environment). Nothing secret is stored in this repo.

services:
  # ============================================================
  # 1) BACKEND API
  # ============================================================
  - type: web
    name: akij-readymix-api
    runtime: python
    pythonVersion: "3.11.9"
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: >
      apt-get update -y &&
      ACCEPT_EULA=Y apt-get install -y gnupg curl unixodbc unixodbc-dev &&
      curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg &&
      echo "deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/mssql-release.list &&
      apt-get update -y &&
      ACCEPT_EULA=Y apt-get install -y msodbcsql18 &&
      gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: MSSQL_SERVER
        sync: false
      - key: MSSQL_PORT
        sync: false
      - key: MSSQL_USER
        sync: false
      - key: MSSQL_PASSWORD
        sync: false
      - key: MSSQL_DATABASE
        sync: false
      - key: MSSQL_BU_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: "*"

  # ============================================================
  # 2) FRONTEND STATIC SITE
  # ============================================================
  - type: static_site
    name: akij-readymix-dashboard
    rootDir: frontend
    buildCommand: ""           # pure HTML - no build step
    staticPublishPath: .
    envVars:
      - key: API_BASE
        value: "https://akij-readymix-api.onrender.com"
